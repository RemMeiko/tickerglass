# 推 tag 即自动构建并发布 Release。
#
# 用法：
#   git tag v0.2.0 && git push origin v0.2.0
# 之后什么都不用做 —— CI 自己编译、自己建 Release、自己传安装包。
#
# 为什么用 Actions 而不是本地 `gh release create`：
# 后者只自动化"上传"，构建仍在本机（实测 release 编译约 3 分钟），
# 且要先 `winget install GitHub.cli` 并登录。Actions 把构建也搬到云端，
# 本地零依赖。代价是 CI 冷启动编译更慢（Rust 依赖全新编译，约 10~15 分钟），
# 但有 cargo 缓存后续会快。
#
# 只构建 Windows：本项目是 Windows 桌面悬浮窗，bundle.targets 是 ["nsis"]，
# 没有 macOS/Linux 产物需求。要加平台就往 matrix 里加 runner。

name: Release

on:
  push:
    tags:
      # ⚠️ 这里是 **glob 模式，不是正则**。首版写成 `v[0-9]+.[0-9]+.[0-9]+`
      # （正则语法）导致 workflow 从未触发 —— glob 里 `+` 是**字面加号**而非
      # "一个或多个"量词，那个模式实际只匹配 `v1+2+3+` 这类字符串，
      # `v0.2.0` 匹配不上。glob 里 `*` 匹配任意字符（不含 `/`）。
      - "v*.*.*"
  # 允许手动触发，方便调试 workflow 本身而不必反复打 tag
  workflow_dispatch:

# 必须显式给写权限：tauri-action 要创建 Release 并上传附件。
# 默认的 GITHUB_TOKEN 只有读权限，不给就是 403。
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 走 package-lock.json 的缓存（本项目用 npm，非 pnpm/yarn）
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Rust 依赖缓存。首次跑没有缓存，之后能把 10~15 分钟压到几分钟。
      # 放在 install 之前：它只依赖 Cargo.lock，与前端无关。
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # 类型检查与单测在构建前跑 —— tag 已经推出去了，
      # 但产物不该在测试红着的情况下发布。
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # 组装 Release 正文：安装说明 + 仓库根目录的 RELEASE_NOTES.md（每次
      # 发版前更新该文件）。多行内容用分隔符写法（<<EOF）进 $GITHUB_OUTPUT，
      # 不能用 echo body=...（会把换行吃掉）。文件缺失时退回占位文案，
      # 别让发版因为它挂掉。
      - name: Compose release body
        id: body
        shell: bash
        run: |
          NOTES="$(cat RELEASE_NOTES.md 2>/dev/null || echo '（本版更新说明暂缺，见 README）')"
          {
            echo 'body<<NOTES_EOF'
            echo '## 安装'
            echo ''
            echo '下载下方 `-setup.exe` 安装包运行即可。未签名 exe 首次运行会被 SmartScreen 拦一次：点「更多信息」→「仍要运行」。'
            echo ''
            echo "$NOTES"
            echo ''
            echo '---'
            echo '由 GitHub Actions 自动构建发布。'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tagName 用推上来的那个 tag；releaseName 去掉 v 前缀更好看
          tagName: ${{ github.ref_name }}
          releaseName: TickerGlass ${{ github.ref_name }}
          releaseBody: ${{ steps.body.outputs.body }}
          # v0.4.0 起 false：用户 2026-11-18 确认直接公开发布，
          # 不再停留草稿等手动点 Publish（v0.3.0/v0.3.1 的草稿积压就是这么来的）
          releaseDraft: false
          prerelease: false

      # 一次性步骤（仅 v0.4.0 这次运行）：把此前积压的两份 Release 草稿转正。
      # 本机没装 gh CLI 且无 API token，但 Actions 的 GITHUB_TOKEN 对本仓库
      # 有 contents:write，runner 上预装了 gh —— 借这次发版顺带把历史草稿发布掉。
      # 之后可以删掉这个 step。
      - name: Publish legacy drafts (one-time, v0.4.0 only)
        if: github.ref == 'refs/tags/v0.4.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v0.3.0 --repo $env:GITHUB_REPOSITORY --draft=false
          gh release edit v0.3.1 --repo $env:GITHUB_REPOSITORY --draft=false
